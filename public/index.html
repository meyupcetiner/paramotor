<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paramotor — Detaylı Muhasebe Analiz Programı</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/paramotor-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="preload" as="image" href="/img/pm-title.png"><link rel="preload" as="image" href="/img/pm-glider.png"><link rel="preload" as="image" href="/img/pm-sub.png">
<script>try{var t=localStorage.getItem('pm_theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="pstage"><div class="ptitle"><img src="/img/pm-title.png" alt="Paramotor"><i class="pcover"></i></div><img class="psub" src="/img/pm-sub.png" alt=""><div class="pglider"><img src="/img/pm-glider.png" alt=""></div></div><button class="skip" type="button">Geç</button></div>
<div id="intro-ts" class="hidden" aria-hidden="true"><div class="stage"><img class="blade" src="/img/intro-blade.svg" alt=""><div class="badge"><img src="/img/intro-badge.png" alt="Testeresan"><i class="shine"></i></div></div></div>
<div id="root"></div>
<script>try{if(localStorage.getItem("pm_intro_every")!=="1"&&sessionStorage.getItem("pm_intro_seen"))document.getElementById("intro").classList.add("hidden");}catch(e){}</script>
<script src="/il-ilce.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
