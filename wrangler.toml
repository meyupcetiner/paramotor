name = "paramotor"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "paramotor-db"
database_id = "BURAYA_D1_ID"   # npx wrangler d1 create paramotor-db çıktısındaki id

# Opsiyonel: yüklenen ekran görüntülerini saklamak için R2
