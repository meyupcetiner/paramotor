<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeplin — Detaylı Muhasebe ve Analiz Programı</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/zeplin-favicon.png">
<link rel="apple-touch-icon" href="/img/zeplin-apple.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zeplin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="preload" as="image" href="/img/zeplin-intro-text.png"><link rel="preload" as="image" href="/img/zeplin-intro-ship.png">
<script>try{var t=localStorage.getItem('pm_theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div id="intro" aria-hidden="true"><div class="pstage"><i class="pglow"></i><img class="ztext" src="/img/zeplin-intro-text.png" alt="Zeplin"><span class="pshine"><i></i></span><img class="zship" src="/img/zeplin-intro-ship.png" alt=""></div><button class="skip" type="button">Geç</button></div>
<div id="intro-ts" class="hidden" aria-hidden="true"><div class="stage"><img class="blade" src="/img/intro-blade.svg" alt=""><div class="badge"><img src="/img/intro-badge.png" alt="Testeresan"><i class="shine"></i></div></div></div>
<div id="root"></div>
<script>try{if(localStorage.getItem("pm_intro_every")!=="1"&&sessionStorage.getItem("pm_intro_seen"))document.getElementById("intro").classList.add("hidden");}catch(e){}</script>
<script src="/il-ilce.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
