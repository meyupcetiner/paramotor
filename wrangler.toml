name = "paramotor"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "DB"
database_name = "paramotor-db"
database_id = "34d4537c-609f-4af8-a0e3-d74ea0ceaa57"

# Opsiyonel: yüklenen ekran görüntülerini saklamak için R2
